<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- 佔位雷達圖：Dust II（示意，非真實地圖）。可替換為真實雷達圖並微調 maps.ts 座標。 -->
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2822"/>
      <stop offset="1" stop-color="#1e1b16"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#dbg)"/>
  <g fill="#3d382d" stroke="#4d4738" stroke-width="2">
    <!-- A 長 / A 點 -->
    <rect x="720" y="180" width="180" height="440"/>
    <rect x="620" y="100" width="220" height="160"/>
    <!-- 中路 -->
    <rect x="440" y="300" width="140" height="360"/>
    <!-- 水道 -->
    <rect x="160" y="340" width="200" height="320"/>
    <!-- B 點 -->
    <rect x="80" y="120" width="240" height="220"/>
    <!-- 出生點 -->
    <rect x="600" y="680" width="220" height="200"/>
    <rect x="300" y="720" width="220" height="200"/>
  </g>
  <text x="500" y="500" fill="#5c5545" font-size="40" font-family="sans-serif" text-anchor="middle" opacity="0.5">DUST II（佔位圖）</text>
</svg>
