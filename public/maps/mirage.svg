<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- 佔位雷達圖：Mirage（示意，非真實地圖）。可替換為真實雷達圖並微調 maps.ts 座標。 -->
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2620"/>
      <stop offset="1" stop-color="#1c1a15"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#mbg)"/>
  <g fill="#3a352b" stroke="#4a4437" stroke-width="2">
    <!-- A 區塊 -->
    <rect x="620" y="60" width="200" height="180"/>
    <rect x="660" y="260" width="240" height="200"/>
    <rect x="840" y="60" width="120" height="180"/>
    <!-- 中路 -->
    <rect x="440" y="140" width="160" height="520"/>
    <!-- 連接 / 貓道 -->
    <rect x="600" y="440" width="120" height="260"/>
    <!-- B 區塊 -->
    <rect x="140" y="100" width="220" height="240"/>
    <rect x="100" y="360" width="240" height="200"/>
    <!-- 出生點 -->
    <rect x="700" y="720" width="200" height="180"/>
    <rect x="100" y="740" width="240" height="180"/>
  </g>
  <text x="500" y="500" fill="#5a5344" font-size="40" font-family="sans-serif" text-anchor="middle" opacity="0.5">MIRAGE（佔位圖）</text>
</svg>
