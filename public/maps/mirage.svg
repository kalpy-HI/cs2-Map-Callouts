<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- 原創示意雷達圖：Mirage（非真實遊戲素材，僅為報點示意）。
       座標與 src/data/maps.ts 的正規化 0..1 報點區對齊（乘以 1000）。 -->
  <defs>
    <style>
      .floor { fill: #3c372b; stroke: #5b5340; stroke-width: 3; }
      .path  { fill: #332f25; stroke: #4a4335; stroke-width: 2; }
      .wall  { fill: none; stroke: #6a6048; stroke-width: 4; }
      .zone  { fill: #7a7258; font: 600 22px sans-serif; opacity: 0.75; }
      .site  { fill: #f0a020; font: 800 40px sans-serif; opacity: 0.85; }
      .siteRing { fill: none; stroke: #f0a020; stroke-width: 4; opacity: 0.6; stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect width="1000" height="1000" fill="#17150f"/>

  <!-- 連接走道（底層，先畫讓房間蓋在上面接縫更自然） -->
  <g class="path">
    <rect x="340" y="600" width="120" height="180"/>  <!-- T→中路/貓道 -->
    <rect x="140" y="540" width="90"  height="240"/>  <!-- 左側 T→B -->
    <rect x="600" y="440" width="120" height="260"/>  <!-- 連接/貓道帶 -->
    <rect x="820" y="360" width="90"  height="380"/>  <!-- A→CT -->
    <rect x="340" y="300" width="120" height="80"/>   <!-- 中路→窗/上中 -->
  </g>

  <!-- 主要區域（與報點座標對齊） -->
  <g class="floor">
    <rect x="620" y="60"  width="200" height="180"/>  <!-- A大/坡道 -->
    <rect x="660" y="260" width="240" height="200"/>  <!-- A點 -->
    <rect x="840" y="60"  width="120" height="180"/>  <!-- 宮殿 -->
    <rect x="500" y="280" width="140" height="160"/>  <!-- 俄羅斯方塊 -->
    <rect x="440" y="140" width="160" height="520"/>  <!-- 中路（含上中/窗） -->
    <rect x="600" y="440" width="120" height="140"/>  <!-- 連接 -->
    <rect x="600" y="580" width="120" height="120"/>  <!-- 貓道 -->
    <rect x="140" y="100" width="220" height="240"/>  <!-- B公寓 -->
    <rect x="100" y="360" width="240" height="200"/>  <!-- B點 -->
    <rect x="700" y="720" width="200" height="180"/>  <!-- CT家 -->
    <rect x="100" y="740" width="240" height="180"/>  <!-- T家 -->
  </g>

  <!-- 內部分隔線：窗 / 上中 -->
  <g class="wall">
    <line x1="440" y1="240" x2="600" y2="240"/>
    <line x1="440" y1="340" x2="600" y2="340"/>
  </g>

  <!-- 炸彈點標記 -->
  <g>
    <circle class="siteRing" cx="780" cy="360" r="52"/>
    <text class="site" x="780" y="374" text-anchor="middle">A</text>
    <circle class="siteRing" cx="220" cy="460" r="52"/>
    <text class="site" x="220" y="474" text-anchor="middle">B</text>
  </g>

  <!-- 區域文字 -->
  <g class="zone" text-anchor="middle">
    <text x="720" y="155">A大</text>
    <text x="900" y="155">宮殿</text>
    <text x="570" y="365">方塊</text>
    <text x="520" y="200">上中</text>
    <text x="530" y="300">窗</text>
    <text x="520" y="470">中路</text>
    <text x="660" y="515">連接</text>
    <text x="660" y="645">貓道</text>
    <text x="250" y="225">B公寓</text>
    <text x="800" y="815">CT家</text>
    <text x="220" y="835">T家</text>
  </g>
</svg>
