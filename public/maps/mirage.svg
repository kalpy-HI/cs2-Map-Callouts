<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- 原創手繪示意雷達圖：Mirage（依中文報點圖重繪的原創示意，非遊戲原始素材）。
       區塊位置對應 src/data/maps.ts 的報點座標（×1000）。 -->
  <defs>
    <style>
      .floor { fill: #37322788; stroke: #5c543f; stroke-width: 2.5; }
      .path  { fill: #2f2b2188; stroke: #4a4234; stroke-width: 2; }
      .site  { fill: #f0a020; font: 800 44px sans-serif; opacity: 0.9; }
      .ring  { fill: none; stroke: #f0a020; stroke-width: 4; opacity: 0.55; stroke-dasharray: 11 9; }
      .spawn { fill: none; stroke: #57c060; stroke-width: 3; opacity: 0.6; }
    </style>
  </defs>

  <rect width="1000" height="1000" fill="#17150f"/>

  <!-- 連接走道（底層） -->
  <g class="path">
    <rect x="360" y="470" width="130" height="180"/>  <!-- VIP → Jungle -->
    <rect x="430" y="470" width="130" height="260"/>  <!-- 中路 → A -->
    <rect x="560" y="380" width="240" height="70"/>   <!-- 中路 → 中遠/匪家 -->
    <rect x="200" y="470" width="180" height="180"/>  <!-- 超市 → 警家 -->
    <rect x="720" y="240" width="110" height="120"/>  <!-- 匪二樓 → 匪家 -->
    <rect x="620" y="560" width="90"  height="220"/>  <!-- A1 → A2 -->
  </g>

  <!-- 主要區域 -->
  <g class="floor">
    <rect x="90"  y="150" width="290" height="200"/>  <!-- B公寓/二樓 -->
    <rect x="150" y="350" width="230" height="150"/>  <!-- 超市/窗戶 -->
    <rect x="360" y="200" width="220" height="200"/>  <!-- 廚房/B連接/B小 -->
    <rect x="540" y="150" width="210" height="140"/>  <!-- 匪二樓/上中 -->
    <rect x="360" y="400" width="220" height="150"/>  <!-- VIP/中路 -->
    <rect x="590" y="360" width="200" height="160"/>  <!-- 中遠/沙袋 -->
    <rect x="790" y="290" width="140" height="150"/>  <!-- 匪家 -->
    <rect x="340" y="560" width="150" height="150"/>  <!-- Jungle -->
    <rect x="490" y="560" width="180" height="120"/>  <!-- 三明治/A1箱/跳台 -->
    <rect x="650" y="560" width="240" height="150"/>  <!-- A1/房沿 -->
    <rect x="200" y="620" width="200" height="150"/>  <!-- 警家 -->
    <rect x="430" y="690" width="240" height="150"/>  <!-- A點/長短箱 -->
    <rect x="650" y="700" width="240" height="140"/>  <!-- A2 -->
  </g>

  <!-- 出生點外框 -->
  <g class="spawn">
    <rect x="795" y="295" width="130" height="140"/>  <!-- 匪家 -->
    <rect x="205" y="625" width="190" height="140"/>  <!-- 警家 -->
  </g>

  <!-- 炸彈點標記 -->
  <g>
    <circle class="ring" cx="225" cy="300" r="54"/>
    <text class="site" x="225" y="315" text-anchor="middle">B</text>
    <circle class="ring" cx="525" cy="750" r="54"/>
    <text class="site" x="525" y="765" text-anchor="middle">A</text>
  </g>
</svg>
